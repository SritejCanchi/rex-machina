<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rex Machina</title>
<style>
  :root{
    --bg:#0d0f11; --panel:#14181c; --line:#232a31; --ink:#dfe5ea;
    --dim:#8b97a2; --hot:#e0a34a; --cold:#6fa8c7; --bad:#c9564b; --good:#7fb069;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       display:flex;justify-content:center;padding:16px}
  #app{width:100%;max-width:760px}
  h1{font-size:19px;letter-spacing:.14em;margin:0 0 2px;font-weight:600}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;
         padding:14px 16px;margin-bottom:12px}
  .hud{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--dim)}
  .hud b{color:var(--ink);font-weight:600}
  .bar{height:4px;background:#20262c;border-radius:2px;margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--cold)}
  #say{min-height:66px}
  #say p{margin:0 0 8px}
  #say p:last-child{margin-bottom:0}
  .rex{color:var(--hot)}
  .sys{color:var(--dim);font-size:13px}
  .win{color:var(--good)} .lose{color:var(--bad)}
  table.grid{border-collapse:collapse;margin:2px auto}
  table.grid td{width:30px;height:30px;text-align:center;vertical-align:middle;
                font-size:12px;color:#39424b;border:1px solid #191e23}
  td.dog{color:var(--good);font-weight:700}
  td.rexT{color:var(--bad);font-weight:700}
  td.kid{color:var(--hot);font-weight:700}
  td.cover{color:#4a545e} td.exit{color:#3d4a55}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{background:#1b2126;color:var(--ink);border:1px solid var(--line);
         border-radius:5px;padding:9px 15px;font:inherit;font-size:13px;cursor:pointer}
  button:hover:not(:disabled){border-color:#3a4650;background:#222a30}
  button:disabled{opacity:.35;cursor:default}
  button.key{min-width:62px;padding:9px 6px}
  .pad{display:grid;grid-template-columns:repeat(3,62px);gap:6px;margin:12px auto 0;width:198px}
  .prov{color:#5b666f;font-size:11px;margin-top:14px;text-align:center}
  .prov code{color:#6d7a84}
  td.pred{color:var(--cold);font-weight:700}
  .ctl{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
  .hintbox{flex:1;font-size:12px;color:var(--ink);min-height:18px;line-height:1.5;
           background:#1a2026;border:1px solid #2c3a44;border-left:3px solid var(--hot);
           border-radius:5px;padding:7px 10px}
  .hintbox .hl{color:var(--hot);font-weight:700;font-size:10px;letter-spacing:.12em;
               text-transform:uppercase;margin-right:8px}
  .ctlr{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .diff{font-size:12px;color:var(--dim)}
  .diff select{background:#1b2126;color:var(--ink);border:1px solid var(--line);border-radius:5px;
               padding:6px 8px;font:inherit;font-size:12px;margin-left:4px}
  .tip{font-size:11px;color:var(--dim);text-align:center;min-height:16px;margin:4px 0 6px}
  .boardwrap{display:flex;justify-content:center;margin:2px 0 8px}
  canvas#board,canvas#strip{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;
               cursor:pointer;image-rendering:auto}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--dim);
          justify-content:center;margin-bottom:6px}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .legend .you{background:#8a5a2b;box-shadow:0 0 0 2px rgba(127,176,105,.9)}
  .legend .rex{background:#6f7887;box-shadow:0 0 6px rgba(201,86,75,.8)}
  .legend .pred{background:transparent;border:2px solid var(--cold)}
  .legend .kid{background:#c9564b;box-shadow:0 0 0 2px rgba(224,163,74,.5)}
  .legend .cover{background:#4a3a26;border:1px solid #7a5f3a}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .badge{color:#6d7a84;font-size:11px;line-height:1.5;border-top:1px dashed var(--line);
         margin-top:12px;padding-top:8px}
  .badge b{color:#8b97a2;font-weight:600}
  .intro h2{font-size:14px;margin:0 0 6px;color:var(--ink)}
  .intro p{margin:0 0 10px}
  .intro ul{margin:0 0 4px;padding-left:18px;color:var(--dim);font-size:12px}
  .intro li{margin-bottom:3px}
  .intro li b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <h1>REX MACHINA</h1>
  <div class="sub">A shelter dog walks home. Nine days, then the thing they replaced her with.</div>
  <div class="panel" id="hudBox"><div class="hud" id="hud"></div></div>
  <div class="panel" id="say"></div>
  <div class="panel" id="stage"></div>
  <div class="badge" id="badge"></div>
  <div class="prov" id="prov"></div>
</div>
<script src="game.js"></script>
</body>
</html>
